name: Check Deployment and Run API Automation
on:
  schedule:
    - cron: '30 14 * * *' # 8:00 PM IST
  workflow_dispatch:

jobs:
  check-deployment:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          ref: opt-cafe

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clean old report directories
        run: |
          rm -rf executionReports target/surefire-reports
          echo "Old report directories cleaned."

      - name: Download Deployment File
        run: |
          curl -o last-deployment.json https://storage.googleapis.com/api-automation-trigger/cafe/last-deployment.json
          echo "Deployment File:"
          cat last-deployment.json

      - name: Check Deployment Date
        id: deployment-check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected. Running tests regardless of deployment date."
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOY_DATE=$(grep -oP '"date"\s*:\s*"\K[^"]+' last-deployment.json)
          TODAY=$(date -u +%F)
          echo "Deployment Date: $DEPLOY_DATE"
          echo "Today's Date (UTC): $TODAY"
          if [ "$DEPLOY_DATE" = "$TODAY" ]; then
            echo "Deployment happened today. Running tests."
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deployment today. Skipping tests."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run API Automation
        id: api-tests
        if: steps.deployment-check.outputs.run_tests == 'true'
        env:
          TZ: Asia/Kolkata
        run: |
          mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Upload Extent Reports
        if: always() && steps.deployment-check.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Reports
          path: executionReports
          if-no-files-found: ignore

      - name: Send Report via Email
        if: always() && steps.deployment-check.outputs.run_tests == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "API Automation Report - ${{ github.run_id }}"
          to: sanghavij243@gmail.com
          from: CI Bot <${{ secrets.EMAIL_USERNAME }}>
          body: |
            API Automation test run completed.
            Branch tested: opt-cafe
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Full Extent Report is attached — please check for pass/fail details.
          attachments: executionReports/*.html
